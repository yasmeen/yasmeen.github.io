<!doctype html>
<!-- A bare stage for rendering Mini Yaz to images (posters, project illustrations, the link preview).
     Driven by render.mjs; options come in the URL hash as JSON: {"w": 583, "opts": {...}}. -->
<meta charset="utf-8">
<style>
  html, body { margin: 0; background: transparent; }
  #box { position: absolute; aspect-ratio: 292 / 343; }
</style>
<div id="box"></div>
<script type="module">
  import { createMiniYaz } from '/assets/mini-yaz/engine.js';
  import { loadThree, loadModel } from '/assets/mini-yaz/mascot.js';
  const q = JSON.parse(decodeURIComponent(location.hash.slice(1) || '{}'));
  const w = q.w || 583, h = w * 343 / 292;
  const box = document.getElementById('box');
  Object.assign(box.style, { width: w + 'px', left: (0.2 * w) + 'px', top: (0.3 * h) + 'px' });
  const [THREE, data] = await Promise.all([loadThree(), loadModel()]);
  window.yaz = createMiniYaz(THREE, box, data, Object.assign({ manual: true, preserve: true, maxDpr: 1, sleepAfter: 0 }, q.opts || {}));
  window.ready = true;
</script>
